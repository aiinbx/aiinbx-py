[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiinbx"
version = "4.6.0"
description = "The official Python SDK for the AI Inbx API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Inbx", email = "support@aiinbx.com" }]
keywords = [
  "aiinbx",
  "email",
  "email-api",
  "send-email",
  "inbound-email",
  "email-threads",
  "email-webhooks",
  "ai-agents",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.10"]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://aiinbx.com"
Documentation = "https://docs.aiinbx.com"
Repository = "https://github.com/aiinbx/aiinbx-py"
Issues = "https://github.com/aiinbx/aiinbx-py/issues"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiinbx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
exclude = ["src/aiinbx/models.py", "src/aiinbx/_generated/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aiinbx/models.py" = ["E501"]
"src/aiinbx/_generated/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["aiinbx"]
